plugins {
    id 'com.android.application'
}

def ndkVersionValue = providers.gradleProperty('crash2.ndkVersion').get()
def generatedJniDir = file('src/main/jniLibs/arm64-v8a')
def probeExecutable = new File(generatedJniDir, 'libcrash2-probe.so')

android {
    namespace 'io.github.crash2recomp'
    compileSdk 36
    ndkVersion ndkVersionValue

    defaultConfig {
        applicationId 'io.github.crash2recomp'
        minSdk 28
        targetSdk 36
        versionCode 1
        versionName '0.1.0'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '4.4.3'
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

tasks.register('buildProbeExecutable', Exec) {
    def sdk = System.getenv('ANDROID_HOME') ?: System.getenv('ANDROID_SDK_ROOT')
    if (!sdk) {
        sdk = new File(System.getProperty('user.home'), 'android-sdk').path
    }
    def clang = new File(sdk, "ndk/${ndkVersionValue}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang")
    inputs.file 'src/main/cpp/probe_tool.c'
    outputs.file probeExecutable
    doFirst {
        generatedJniDir.mkdirs()
        commandLine clang, '-DPROBE_EXECUTABLE', '-fPIE', '-pie',
                file('src/main/cpp/probe_tool.c'), '-o', probeExecutable
    }
}

tasks.register('buildAndroidTools', Exec) {
    commandLine new File(rootProject.projectDir, 'scripts/build-tools.sh')
    inputs.dir new File(rootProject.projectDir, 'native-runtime')
    inputs.dir new File(rootProject.projectDir.parentFile, 'tuning/patches')
    inputs.files(
            new File(rootProject.projectDir, 'scripts/build-tools.sh'),
            new File(rootProject.projectDir, 'scripts/fetch-framework.sh'))
    outputs.files(
            file('src/main/jniLibs/arm64-v8a/libpsxrecomp.so'),
            file('src/main/jniLibs/arm64-v8a/libpsxrecomp-game.so'),
            file('src/main/jniLibs/arm64-v8a/libpsxrecomp-bios.so'),
            file('src/main/jniLibs/arm64-v8a/libtcc-bin.so'),
            file('src/main/jniLibs/arm64-v8a/libtcc.so'),
            file('src/main/jniLibs/arm64-v8a/libmain.so'),
            file('src/main/assets/runtime-toolchain/built.txt'))
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('buildProbeExecutable')
    dependsOn tasks.named('buildAndroidTools')
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
